<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="description" content="Stack Security — Sistema de Gestión de Guardias" />

    <!-- PWA: Estándares modernos -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Stack Security">
    
    <!-- Favicon: SVG para navegadores modernos -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Apple Touch Icon: PNG 180x180 (iOS) -->
    <link rel="apple-touch-icon" href="/favicon.svg">
    
    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Preload críticos -->
    <link rel="preconnect" href="https://api.mapbox.com">
    <link rel="preconnect" href="https://events.mapbox.com">
    <link rel="dns-prefetch" href="https://tiles.mapbox.com">

    <!--
      CSP (OWASP A05 — Security Misconfiguration):
      - connect-src incluye el propio dominio de Railway explícitamente
        para que axios pueda hacer fetch a /api/* sin ser bloqueado
      - worker-src blob: requerido por Mapbox GL JS
      - style-src unsafe-inline requerido por Tailwind en runtime
    -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; connect-src 'self' https://stackdevsecurity-production.up.railway.app https://api.mapbox.com https://events.mapbox.com https://*.tiles.mapbox.com; img-src 'self' data: blob: https://*.tiles.mapbox.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src blob:; child-src blob:;" />

    <title>Stack Security</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
